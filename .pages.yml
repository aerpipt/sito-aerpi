# Configurazione di Pages CMS (https://pagescms.org) per il sito AERPI.
# Definisce il pannello con cui si modificano i file in website/content/.
# Ogni testo ha le versioni it / en / pt: se en o pt restano vuoti, il sito mostra l'italiano.

media:
  input: website/uploads
  output: /uploads
settings:
  content:
    merge: true
  commit:
    identity: user
content:
  - name: eventi
    label: Eventi
    type: file
    path: website/content/eventi.json
    format: json
    list: true
    fields:
      - name: titolo
        label: Titolo
        type: object
        fields:
          - name: it
            label: Italiano
            type: string
            required: true
          - name: en
            label: English
            type: string
          - name: pt
            label: Português
            type: string
      - name: id
        label: "Nome nel link"
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Solo lettere minuscole, numeri e trattini (es. cena-natale-2026)"
        description: "Parte finale del link da condividere: aerpi.org/#evento-… Es.: cena-natale-2026. Deve essere diverso per ogni evento."
      - name: data
        label: Data
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: dataFine
        label: "Data di fine"
        type: date
        options:
          format: yyyy-MM-dd
        description: "Solo se l'evento dura più giorni."
      - name: ora
        label: Ora
        type: string
        description: "Facoltativa, es. 20:00"
      - name: luogo
        label: Luogo
        type: string
      - name: immagine
        label: "Foto principale"
        type: image
      - name: breve
        label: "Testo breve (nella scheda)"
        type: object
        fields:
          - name: it
            label: Italiano
            type: text
            required: true
          - name: en
            label: English
            type: text
          - name: pt
            label: Português
            type: text
      - name: testo
        label: "Testo completo (nel popup)"
        type: object
        fields:
          - name: it
            label: Italiano
            type: text
          - name: en
            label: English
            type: text
          - name: pt
            label: Português
            type: text
      - name: link
        label: "Link (iscrizioni, locandina…)"
        type: string
        description: "Facoltativo. Indirizzo completo, es. https://… oppure mailto:info@aerpi.org"
      - name: galleria
        label: "Galleria foto"
        type: image
        options:
          multiple: true
        description: "Facoltativa. Foto mostrate nel popup; cliccandole si ingrandiscono."
  - name: progetti
    label: Progetti
    type: file
    path: website/content/progetti.json
    format: json
    list: true
    fields:
      - name: titolo
        label: Titolo
